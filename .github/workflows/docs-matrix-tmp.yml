name: s&box editor E2E (experiment)
on:
  push:
    branches: [ci/docs-matrix-check]
permissions:
  contents: read
jobs:
  editor-windows:
    name: "s&box editor (source build) + sbox-cli, Windows"
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: ./ci-fixture/editor-e2e.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e
          path: e2e-out
          if-no-files-found: warn
