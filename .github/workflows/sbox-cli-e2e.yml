# The real Network Storage library inside s&box on windows-latest, driven through sbox-cli:
# the latest Facepunch/sbox-public engine built from source (nothing pinned, so future engine
# releases are picked up automatically), a dedicated server started with -mcp, and sbox-ns from
# this checkout. Runs the library players currently get (the current sbox.game revision's GitHub
# release, else main) and library main.
#
# Hosted runners cannot run the editor: it refuses to start without a logged-in Steam client.
# These runs are therefore `ci-only` evidence; editor `pass` rows still come from
# tools/sbox-cli-e2e on a machine with Steam (docs/editor-test-plan.md).
name: sbox-cli e2e

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/parity/corpus/**"
      - "tools/sbox-cli-e2e/**"
      - ".github/workflows/sbox-cli-e2e.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      library:
        description: "Library: latest, main, git:<ref> or r<revision> (runs only this one)"
        required: false
        default: ""
      engine_ref:
        description: "Facepunch/sbox-public ref (default: HEAD)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sbox-cli-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated:
    name: Dedicated server + sbox-cli (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build s&box from source
        shell: pwsh
        env:
          ENGINE_REF: ${{ inputs.engine_ref }}
        run: |
          $engine = Join-Path $env:RUNNER_TEMP 'sbox-public'
          git clone -q --filter=blob:none https://github.com/Facepunch/sbox-public.git $engine
          if ($env:ENGINE_REF) { git -C $engine checkout -q $env:ENGINE_REF }
          $sha = git -C $engine rev-parse HEAD
          "ENGINE=$engine/game" | Add-Content $env:GITHUB_ENV
          Write-Host "engine $sha $(git -C $engine log -1 --format='%cs %s')"
          Push-Location $engine
          cmd /c Setup.bat
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Setup.bat failed ($code)" }
          foreach ($f in 'sbox-server.exe', 'bin/managed/sbox-cli.exe') {
            if (-not (Test-Path "$engine/game/$f")) { throw "engine build has no $f" }
          }

      - name: Library players have (latest sbox.game revision)
        if: ${{ inputs.library == '' }}
        shell: pwsh
        run: dotnet run tools/sbox-cli-e2e/run.cs -- --engine $env:ENGINE --targets dedicated --library latest --startup-timeout 600 --out e2e-out/latest

      - name: Library main
        if: ${{ always() && inputs.library == '' }}
        shell: pwsh
        run: dotnet run tools/sbox-cli-e2e/run.cs -- --engine $env:ENGINE --targets dedicated --library main --no-build --startup-timeout 600 --out e2e-out/main

      - name: Library ${{ inputs.library }}
        if: ${{ inputs.library != '' }}
        shell: pwsh
        env:
          LIBRARY: ${{ inputs.library }}
        run: dotnet run tools/sbox-cli-e2e/run.cs -- --engine $env:ENGINE --targets dedicated --library $env:LIBRARY --startup-timeout 600 --out e2e-out/requested

      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem e2e-out -Recurse -Filter summary.md | ForEach-Object { Get-Content $_.FullName -Raw | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbox-cli-e2e
          path: e2e-out
          if-no-files-found: warn
